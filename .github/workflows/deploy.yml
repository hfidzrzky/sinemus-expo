name: Sinemus Expo CI - Quality & Build Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: 🧪 Validate, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # BACKEND CHECK (Laravel 11, PHP 8.4)
      # ----------------------------------------------------
      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, redis, bcmath, gd, zip
          coverage: none

      - name: 📦 Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📥 Install Composer Dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: 🎨 Run Laravel Pint (Code Style & Standards)
        working-directory: backend
        run: vendor/bin/pint --test

      - name: 🔍 Verify Backend Syntax & Route Compilation
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan route:list

      # ----------------------------------------------------
      # FRONTEND CHECK (React 19 + Vite + TypeScript)
      # ----------------------------------------------------
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install NPM Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🛡️ Strict TypeScript Check (Zero 'any' Invariant)
        working-directory: frontend
        run: npm run type-check

      - name: 🔍 ESLint Check (Code Quality & React Standards)
        working-directory: frontend
        run: npm run lint

      - name: 💅 Prettier Format Check
        working-directory: frontend
        run: npm run format:check

      - name: 📦 Compile Frontend Production Bundle
        working-directory: frontend
        run: npm run build
